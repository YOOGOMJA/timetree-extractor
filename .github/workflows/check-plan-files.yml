name: Check plan files

on:
  pull_request:
    paths:
      - 'docs/superpowers/plans/**'

jobs:
  warn:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Find added plan files
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const planFiles = files
              .filter(f =>
                f.filename.startsWith('docs/superpowers/plans/') &&
                f.status !== 'removed'
              )
              .map(f => f.filename);
            core.setOutput('found', planFiles.length > 0 ? 'true' : 'false');
            core.setOutput('files', planFiles.join('\n'));

      - name: Comment on PR
        if: steps.find.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.find.outputs.files }}`.trim().split('\n').filter(Boolean);
            const list = files.map(f => `- \`${f}\``).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ⚠️ 구현 계획 파일이 포함되어 있습니다',
                '',
                `다음 파일은 \`docs/superpowers/plans/\` 아래에 있는 구현 계획 파일입니다.`,
                '구현이 완료된 경우 PR 머지 전에 삭제해 주세요.',
                '',
                list,
                '',
                '> 이 파일들은 작업 중 참고용 문서이며, main 브랜치에 유지할 필요가 없습니다.',
              ].join('\n')
            });
